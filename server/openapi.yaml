openapi: 3.1.0
info:
  title: Stars Trail API
  version: v1
  description: |
    Contract between the Android app (Kotlin) and the Go server (spec §3.2); the two share no code.
    Every path is under /v1. The app sends on every request:
    - `X-Device-Id`: an anonymous per-install ID, the key for the weather proxy's daily quota (falls back to the caller's IP).
    - `X-Client-Version`: its Android versionCode. Below `minClientVersion` every route except
      /v1/health and /v1/version answers 426; offline features never depend on the server.
      A request without the header is not gated (curl, monitoring), so the app must always send it:
      an app that forgets it can never be forced to update.
    Every future feature path lists both headers and the 426 response.
    Routes marked with bearerAuth need `Authorization: Bearer <token>` from /v1/auth/login; a missing,
    unknown or logged-out token is 401 unauthorized. Everything else is anonymous.
    Every error body is an Error: a code from ErrorCode plus the fields that code documents (ADR 0004).
    The Go server is generated from this file (`go generate ./...`, oapi-codegen): edit here first.
servers:
  - url: /v1
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: 'the token from /v1/auth/login; valid until logout'}
  parameters:
    DeviceId: {name: X-Device-Id, in: header, schema: {type: string}}
    ClientVersion: {name: X-Client-Version, in: header, schema: {type: integer}}
    TeamId: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    After: {name: after, in: query, schema: {type: integer, format: int64}, description: 'a Team''s cursor: only positions and messages stored after it'}
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request      # body or parameters don't parse
        - internal             # server-side failure; details only in the server log
        - rate_limited         # login tries only
        - client_outdated
        - invalid_region
        - region_too_large
        - region_unsupported
        - daily_quota_exceeded
        - data_unavailable
        - unauthorized         # no, unknown or logged-out bearer token
        - invalid_phone        # not an 11-digit +86 mobile number
        - wrong_code           # the SMS code doesn't match, or has expired
        - sms_too_frequent     # this number was sent too many codes; wait before asking again
        - sms_unavailable      # the SMS provider failed or isn't configured
        - team_not_found       # no active team has this code, or the caller isn't a member of this team
        - not_initiator        # only the 发起人 may end the trip or set the 队伍轨迹
        - team_ended           # the trip was ended: no more positions or sharing
        - image_not_found      # no such image in this team, no such synced photo of the caller's, or no such 头像
        - photo_quota_exceeded # the caller's synced photos would pass 1 GB (spec §2.12); keep this one on the phone
        - no_team_track        # the team has no 队伍轨迹 (none given, 取消, or the trip ended)
    Error:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorCode'}
        minClientVersion: {type: integer, description: set when error is client_outdated}
        maxAreaKm2: {type: integer, description: set when error is region_too_large}
        quotaBytes: {type: integer, format: int64, description: set when error is photo_quota_exceeded}
        quotaCells: {type: integer, format: int64, description: set when error is daily_quota_exceeded on weather}
    CodeRequest:
      type: object
      required: [phone]
      properties:
        phone: {type: string, description: '11-digit mainland mobile number, no +86'}
    LoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone: {type: string}
        code: {type: string, description: the code from the SMS}
    Login:
      type: object
      required: [token]
      properties:
        token: {type: string, description: 'bearer token; the app keeps it encrypted and sends it until logout'}
    Me:
      type: object
      required: [id, phone, nickname]
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        nickname: {type: string, description: 'what teammates see, in every team (spec ux-v3 §8.4 第 5 条); a new account gets a default such as 岩羊27'}
        avatar: {type: string, description: 'the 头像, from /avatars/{avatar}; absent: none (shown by the nickname''s first character)'}
    NicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname: {type: string, description: '1–12 characters once spaces at either end are trimmed; emoji allowed'}
    TeamRequest:
      type: object
      description: Nothing to give; members are shown by their account's nickname (a name sent by older apps is ignored).
    JoinRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{4}$'}
    TeamCard:
      type: object
      description: 'The 队伍卡片 shown before joining (spec ux-v3 §8.4 第 2 条): who started it, how many are in it, since when.'
      required: [id, initiator, members, createdAt]
      properties:
        id: {type: integer, format: int64}
        initiator: {type: string, description: 'the 发起人''s nickname as it is now; 已注销用户 once their account is deleted'}
        initiatorAvatar: {type: string, description: 'the 发起人''s 头像, from /avatars/{avatar}; absent: none'}
        members: {type: integer}
        createdAt: {type: integer, format: int64, description: Unix seconds}
    Team:
      type: object
      description: |
        A 队伍 as the caller sees it. Positions and messages are those stored after the `after` cursor the
        request gave (all of them without one); `cursor` is the last stored so far, to pass as `after` next time.
      required: [id, code, initiator, me, ended, cursor, members, messages]
      properties:
        id: {type: integer, format: int64}
        me: {type: integer, format: int64, description: the caller's user id, to find themselves among the members}
        code: {type: string, description: 4-digit join code; free for another team once the trip ends}
        initiator: {type: integer, format: int64, description: user id of the 发起人}
        ended: {type: boolean, description: 结束行程 happened; nobody shares any more}
        cursor: {type: integer, format: int64}
        members: {type: array, items: {$ref: '#/components/schemas/Member'}}
        messages: {type: array, items: {$ref: '#/components/schemas/Message'}, description: '队伍对话, in the order stored'}
        track: {$ref: '#/components/schemas/TeamTrackRef'}
    TeamTrackRef:
      type: object
      description: 'The 队伍轨迹 (spec §2.11) without its points, which GET /teams/{id}/track has; absent when there is none.'
      required: [version, uuid, name, reversed, start]
      properties:
        version: {type: integer, format: int64, description: 'grows with every 指定, 更换, 改起算点 and 取消: a member fetches the points when it changes'}
        uuid: {type: string, maxLength: 64, description: 'the 发起人''s track it was taken from: the same track goes into a member''s 我的轨迹 once'}
        name: {type: string, minLength: 1, maxLength: 100}
        reversed: {type: boolean, description: '起算点: 反向'}
        start: {type: number, format: double, minimum: 0, description: 'a loop''s 起点, metres along the points as they go (0: their own start)'}
    TeamTrackRequest:
      type: object
      description: 'A 队伍轨迹 as the 发起人 gives it: a snapshot, kept until 更换, 取消 or 结束行程. Points in WGS-84.'
      required: [uuid, name, reversed, start, points]
      properties:
        uuid: {type: string, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 100}
        reversed: {type: boolean}
        start: {type: number, format: double, minimum: 0}
        points: {type: array, minItems: 2, maxItems: 50000, items: {$ref: '#/components/schemas/SyncPoint'}}
    TeamTrack:
      type: object
      description: The 队伍轨迹 with its points (TeamTrackRequest as stored, and its version).
      required: [version, uuid, name, reversed, start, points]
      properties:
        version: {type: integer, format: int64}
        uuid: {type: string}
        name: {type: string}
        reversed: {type: boolean}
        start: {type: number, format: double}
        points: {type: array, items: {$ref: '#/components/schemas/SyncPoint'}}
    Member:
      type: object
      required: [id, name, sharing, positions]
      properties:
        id: {type: integer, format: int64, description: user id}
        name: {type: string, description: their account's nickname as it is now}
        avatar: {type: string, description: 'their account''s 头像 as it is now, from /avatars/{avatar}; absent: none'}
        sharing: {type: boolean, description: false after 停止共享 (or 结束行程)}
        positions: {type: array, items: {$ref: '#/components/schemas/Position'}, description: 'in the order stored; 尾迹 sorts by time'}
    Position:
      type: object
      required: [time, lat, lon]
      properties:
        time: {type: integer, format: int64, description: 'fix time, Unix seconds'}
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lon: {type: number, format: double, minimum: -180, maximum: 180}
        battery: {type: integer, minimum: 0, maximum: 100, description: percent}
    Positions:
      type: object
      required: [positions]
      properties:
        positions: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/Position'}}
    MessageKind:
      type: string
      enum:
        - text       # text
        - location   # lat, lon, along
        - image      # image, from /teams/{id}/images
        - system     # text: the server's own note (队伍轨迹 given, changed or dropped), from the member it's about; not sendable
    MessageRequest:
      type: object
      description: 'Only what the kind carries (MessageKind) is kept: text 1–1000 characters, image one uploaded to this team.'
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/MessageKind'}
        text: {type: string, maxLength: 1000}
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lon: {type: number, format: double, minimum: -180, maximum: 180}
        image: {type: string}
        along:
          type: array
          maxItems: 20
          items: {type: number, format: double, minimum: 0}
          description: 'the sender''s 沿轨里程 on the 队伍轨迹 in metres, all of them (spec §2.11); empty: not on it; absent: no 队伍轨迹'
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: 'the app''s own id for this message, the same on every resend: one already stored with it from the same sender is given back, not stored again'
    Message:
      type: object
      description: A MessageRequest as stored, with who sent it and when.
      required: [seq, name, time, kind]
      properties:
        seq: {type: integer, format: int64, description: 'order within the team, comparable with a Team''s cursor: unread are those after the last one read'}
        from: {type: integer, format: int64, description: 'sender''s user id; absent once their account is deleted'}
        name: {type: string, description: 'the sender''s nickname as it is now (they may have left since); 已注销用户 once their account is deleted'}
        time: {type: integer, format: int64, description: 'server time, Unix seconds'}
        kind: {$ref: '#/components/schemas/MessageKind'}
        text: {type: string}
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        image: {type: string}
        along: {type: array, items: {type: number, format: double}}
    Image:
      type: object
      required: [image]
      properties:
        image: {type: string, description: id to send in an image message}
    SyncPoint:
      type: object
      required: [t, lat, lon, s]
      properties:
        t: {type: integer, format: int64, description: 'fix time, Unix milliseconds; 0 when unknown (a planned or time-less import)'}
        lat: {type: number, format: double, description: as recorded or imported; the track's datum says how to read it}
        lon: {type: number, format: double}
        ele: {type: number, format: double, description: metres; absent if unknown}
        s: {type: integer, description: segment (a track is paused and continued in segments)}
    SyncTrack:
      type: object
      description: |
        A 轨迹 as synced (spec §2.12), keyed by the id the phone made for it. Only ended tracks sync, and their
        points (and source) never change; the attributes (name, datum) do. deleted is a 删除标记: the track is gone, its
        points and attributes with it. public: a 公开轨迹 (spec §2.8), shown to everyone in /tiles/public-tracks.
      required: [id, startedAt, endedAt, planned, points, name, datum, public, deleted, source]
      properties:
        id: {type: string, description: 32 lowercase hex digits}
        startedAt: {type: integer, format: int64, description: Unix milliseconds}
        endedAt: {type: integer, format: int64, description: Unix milliseconds}
        planned: {type: boolean, description: 计划轨迹}
        source: {type: string, description: 'where it came from, shown under its name (「来自 佳明 fēnix 7」); empty for most; fixed like the points'}
        points: {type: array, items: {$ref: '#/components/schemas/SyncPoint'}, description: in the order recorded or imported}
        name: {type: string, description: empty for a recording (shown by its start time)}
        datum: {$ref: '#/components/schemas/Datum'}
        public: {type: boolean}
        deleted: {type: boolean}
    SyncWaypoint:
      type: object
      description: A 标注 as synced. Its place and time never change; name, description, photo and group do. deleted as in SyncTrack.
      required: [id, track, group, time, lat, lon, name, description, photo, deleted]
      properties:
        id: {type: string, description: 32 lowercase hex digits}
        track: {type: string, description: 'the SyncTrack it was added on, or empty'}
        group: {type: string, description: 'the SyncGroup it is in, or empty; never set with track'}
        time: {type: integer, format: int64, description: 'Unix milliseconds; 0 when unknown'}
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        ele: {type: number, format: double}
        name: {type: string}
        description: {type: string}
        photo: {type: string, description: 'a photo from /sync/photos, or empty'}
        deleted: {type: boolean}
    SyncGroup:
      type: object
      description: |
        A 标注组 as synced (#121), keyed by the id the phone made for it. Names are unique per account on the
        phones, not here: a phone that pulls a name it already has renames its copy and pushes that back.
        Deleting a group deletes its 标注: the phone pushes their 删除标记 too. deleted as in SyncTrack.
      required: [id, name, deleted]
      properties:
        id: {type: string, description: 32 lowercase hex digits}
        name: {type: string}
        deleted: {type: boolean}
    Datum:
      type: string
      enum: [WGS84, GCJ02, BD09]
      description: 坐标纠偏 the track's points (and its 标注) are read with
    SyncTrackChange:
      type: object
      description: |
        What changed of a track. A track new to the server needs startedAt, endedAt, planned and points (else
        invalid_request); on a known one those and source are ignored. Attributes left out stay as they are; those sent
        overwrite, each on its own: the last the server receives wins. After deleted, changes are ignored.
      required: [id]
      properties:
        id: {type: string}
        startedAt: {type: integer, format: int64}
        endedAt: {type: integer, format: int64}
        planned: {type: boolean}
        points: {type: array, items: {$ref: '#/components/schemas/SyncPoint'}}
        source: {type: string, maxLength: 200}
        name: {type: string, maxLength: 200}
        datum: {$ref: '#/components/schemas/Datum'}
        public: {type: boolean, description: 'publish as a 公开轨迹, or withdraw it; deleting withdraws it too'}
        deleted: {type: boolean, description: 'true: 删除标记; false is ignored'}
    SyncWaypointChange:
      type: object
      description: As SyncTrackChange; a new 标注 needs time, lat and lon. photo must be one of the caller's, or empty.
      required: [id]
      properties:
        id: {type: string}
        track: {type: string}
        group: {type: string, description: 'a SyncGroup id, or empty for none; overwrites like an attribute'}
        time: {type: integer, format: int64}
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        ele: {type: number, format: double}
        name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 10000}
        photo: {type: string}
        deleted: {type: boolean, description: 'true: 删除标记; false is ignored'}
    SyncGroupChange:
      type: object
      description: As SyncTrackChange; a new group needs name.
      required: [id]
      properties:
        id: {type: string}
        name: {type: string, maxLength: 200}
        deleted: {type: boolean, description: 'true: 删除标记; false is ignored'}
    SyncChanges:
      type: object
      required: [tracks, waypoints]
      properties:
        tracks: {type: array, items: {$ref: '#/components/schemas/SyncTrackChange'}}
        groups: {type: array, items: {$ref: '#/components/schemas/SyncGroupChange'}, description: 'stored before the waypoints'}
        waypoints: {type: array, items: {$ref: '#/components/schemas/SyncWaypointChange'}}
    Sync:
      type: object
      description: 'Tracks, 标注组 and 标注 changed after the `after` cursor (by anyone: the caller''s own writes come back too), in the order changed.'
      required: [cursor, more, tracks, groups, waypoints]
      properties:
        cursor: {type: integer, format: int64, description: pass as after next time}
        more: {type: boolean, description: 'there are more changes: ask again with the cursor'}
        tracks: {type: array, items: {$ref: '#/components/schemas/SyncTrack'}}
        groups: {type: array, items: {$ref: '#/components/schemas/SyncGroup'}}
        waypoints: {type: array, items: {$ref: '#/components/schemas/SyncWaypoint'}}
    Photo:
      type: object
      required: [photo]
      properties:
        photo: {type: string, description: id to set as a SyncWaypoint's photo}
    Sharing:
      type: object
      required: [sharing]
      properties:
        sharing: {type: boolean}
    Health:
      type: object
      required: [status, postgis]
      properties:
        status: {type: string, enum: [ok]}
        postgis: {type: string, description: postgis_lib_version()}
    HealthDown:
      type: object
      required: [status]
      properties:
        status: {type: string}
    Version:
      type: object
      required: [api, minClientVersion]
      properties:
        api: {type: string, enum: [v1]}
        minClientVersion: {type: integer}
    DataVersion:
      type: object
      required: [version]
      properties:
        version: {type: string}
    PackageRequest:
      type: object
      description: Exactly one of bbox or track.
      properties:
        bbox: {type: array, items: {type: number, format: double}, minItems: 4, maxItems: 4, description: '[west, south, east, north], WGS-84'}
        track:
          type: array
          minItems: 2
          maxItems: 5000
          items: {type: array, items: {type: number, format: double}, minItems: 2, maxItems: 2, description: '[lon, lat]'}
    FeatureCollection:
      type: object
      description: GeoJSON (RFC 7946)
      required: [type, features]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features: {type: array, items: {type: object, x-go-type: json.RawMessage, description: a GeoJSON Feature}}
    Package:
      type: object
      required: [version, bytes, files, outline]
      properties:
        version: {type: string}
        bytes: {type: integer, format: int64}
        files: {type: array, items: {$ref: '#/components/schemas/PackageFile'}}
        outline: {type: object, x-go-type: json.RawMessage, description: 'the area actually clipped to, a GeoJSON Polygon or MultiPolygon (WGS-84): the snapped bbox, or the track corridor'}
    PackageFile:
      type: object
      required: [name, url, bytes]
      properties:
        name: {type: string, enum: [basemap.pmtiles, dem.pmtiles, contours.pmtiles, places.sqlite, routes.geojson, public-tracks.geojson]}
        url: {type: string}
        bytes: {type: integer, format: int64}
    WeatherRequest:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/WeatherPoint'}
    WeatherPoint:
      type: object
      required: [lon, lat, time]
      properties:
        lon: {type: number, format: double}
        lat: {type: number, format: double}
        time: {type: integer, format: int64, description: 'expected arrival, Unix seconds; the forecast for the hour it falls in is returned'}
    Weather:
      type: object
      required: [hours, warnings, sources]
      properties:
        hours:
          type: array
          description: One per point that has a forecast for its hour (points past the forecast range have none).
          items: {$ref: '#/components/schemas/WeatherHour'}
        warnings:
          type: array
          description: Official warnings (官方预警) in force in any of the points' cells, each once.
          items: {$ref: '#/components/schemas/WeatherWarning'}
        sources: {type: array, items: {type: string, enum: [qweather, open-meteo]}, description: 'providers the answer came from, for attribution'}
    WeatherHour:
      type: object
      required: [point, temp, feelsLike, precip, gust, thunder, sky]
      properties:
        point: {type: integer, description: index into the request's points}
        temp: {type: number, format: double, description: °C at elevation}
        feelsLike: {type: number, format: double, description: °C at elevation}
        precip: {type: number, format: double, description: mm in the hour}
        gust: {type: number, format: double, description: 'm/s; estimated from the mean wind where the provider has no gusts'}
        thunder: {type: boolean, description: thunderstorm weather}
        sky: {type: string, enum: [clear, partly, cloudy, fog, rain, snow], description: 'the hour''s weather for its icon: 晴, 多云, 阴, 雾/霾/沙尘, 雨, 雪 (雨夹雪 counts as snow); thunder says 雷阵雨 on top'}
        windDir: {type: number, format: double, description: 'degrees the wind blows from, 0 = north; absent if unknown'}
        elevation: {type: number, format: double, description: 'metres the temperatures are for (the cell''s ground); absent if unknown'}
    WeatherWarning:
      type: object
      required: [id, title, text, thunder]
      properties:
        id: {type: string}
        title: {type: string}
        text: {type: string}
        thunder: {type: boolean, description: a lightning or severe convection warning}
    SearchResults:
      type: object
      required: [places, sources]
      properties:
        places: {type: array, items: {$ref: '#/components/schemas/Place'}}
        sources: {type: array, items: {type: string, enum: [photon, tianditu]}, description: 'providers the answer came from, for attribution'}
    Place:
      type: object
      required: [name, kind, lon, lat]
      properties:
        name: {type: string}
        kind: {type: string, description: 'OSM value (peak, village, attraction, …) from Photon; 天地图 answers are poi or area'}
        lon: {type: number, format: double}
        lat: {type: number, format: double}
        detail: {type: string, description: 'where it is, e.g. 陕西省 宝鸡市, to tell same-named places apart'}
  responses:
    RateLimited:
      description: Too many login tries for this number within the hour (rate_limited).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ClientOutdated:
      description: Client older than minClientVersion (client_outdated); the app shows "update required" on this online feature.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Internal:
      description: Server-side failure (internal).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: No, unknown or logged-out bearer token (unauthorized); the app logs out locally.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    SmsUnavailable:
      description: The SMS provider failed or isn't configured (sms_unavailable).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TeamNotFound:
      description: No such team, or the caller isn't in it (team_not_found).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    DataUnavailable:
      description: Source data unreadable (data_unavailable).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness plus database/PostGIS reachability
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {description: Database unreachable, content: {application/json: {schema: {$ref: '#/components/schemas/HealthDown'}}}}
  /version:
    get:
      operationId: getVersion
      summary: API version and the oldest client versionCode still served
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Version'}}}}
  /offline/version:
    get:
      operationId: getOfflineVersion
      summary: Version of the offline map data; packages downloaded under another version show "可更新"
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DataVersion'}}}}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /offline/packages:
    post:
      operationId: postOfflinePackages
      summary: Clip an offline package (spec §2.3) for a viewport or along a track
      description: |
        Give exactly one of `bbox` or `track`. A bbox snaps outward to 0.01°; a track is buffered by 2 km.
        The same area is clipped once per data version and served from cache after that. Limits: the
        area is at most maxAreaKm2 (100 × 100 km). Areas outside the data (China) are region_unsupported.
        public-tracks.geojson is a snapshot, taken on every request, of the 公开轨迹 crossing the area (a
        FeatureCollection of MultiLineStrings, as in /tiles/public-tracks). routes.geojson (徒步线路 from OSM,
        /data/osm-extract) holds every feature whose extent meets the area's, whole, each with `name`.
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PackageRequest'}}}
      responses:
        '200': {description: Signed download URLs, valid for 15 minutes, content: {application/json: {schema: {$ref: '#/components/schemas/Package'}}}}
        '400': {description: 'invalid_request, invalid_region, region_too_large or region_unsupported', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /nearby-tracks:
    get:
      operationId: getNearbyTracks
      summary: 经过这里的轨迹 (spec §2.8)：the 公开轨迹 passing within radius metres of a point
      description: |
        At most 20, whole, as one GeoJSON FeatureCollection of MultiLineStrings, each with `kind` `public`
        and nothing else, as in an offline package's public-tracks.geojson. No login.
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: lat, in: query, required: true, schema: {type: number, format: double}}
        - {name: lon, in: query, required: true, schema: {type: number, format: double}}
        - {name: radius, in: query, required: true, schema: {type: number, format: double}, description: 'metres, 1–500'}
      responses:
        '200': {description: The tracks, content: {application/geo+json: {schema: {$ref: '#/components/schemas/FeatureCollection'}}}}
        '400': {description: 'invalid_request: lat, lon or radius out of range', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /data/osm-extract:
    get:
      operationId: getOsmExtract
      summary: The script and tag rules the 徒步线路 were extracted from OSM with (ODbL, spec §3.3)
      description: |
        Uploaded with the data it made (scripts/upload-data.sh), so it is the one behind the packages'
        routes.geojson. The app's 关于 page links here. No login.
      responses:
        '200': {description: A bash script, content: {text/plain: {schema: {type: string}}}}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /tiles/tianditu/{layer}/{z}/{x}/{y}:
    get:
      operationId: getTiandituTile
      summary: A 天地图 tile through the server, so the key never ships in the app (spec §2.2)
      description: |
        Web Mercator XYZ tiles, 256 px, z 1–18. Layers: vec 矢量, cva 矢量注记, img 影像, cia 影像注记.
        When 天地图 fails or isn't configured the answer is data_unavailable.
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: layer, in: path, required: true, schema: {type: string, enum: [vec, cva, img, cia]}}
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 18}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The tile, as 天地图 sent it (PNG or JPEG)
          headers:
            Cache-Control: {schema: {type: string}, description: tiles may be cached for a week}
          content: {image/*: {schema: {type: string, format: binary}}}
        '400': {description: 'invalid_request: unknown layer, or the tile is outside the zoom level', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /tiles/terrain/{layer}/{z}/{x}/{y}:
    get:
      operationId: getTerrainTile
      summary: A tile of the China PMTiles the offline packages are clipped from (spec §3.1), for 地形 online
      description: |
        Read from the private bucket with go-pmtiles, headers and directories cached on the server (ADR 0001:
        a thin endpoint, not a tile server). basemap (vector, z 0–15), dem (terrarium WebP, 512 px, z 0–11),
        contours (vector, z 12–14). Vector tiles may be gzipped (Content-Encoding).
        A tile the archive doesn't hold, or a zoom outside its range, is 204.
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: layer, in: path, required: true, schema: {type: string, enum: [basemap, dem, contours]}}
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 15}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The tile
          headers:
            Cache-Control: {schema: {type: string}, description: 'a day: the data is replaced quarterly'}
            Content-Encoding: {schema: {type: string}, description: 'gzip for vector tiles stored compressed'}
          content:
            application/vnd.mapbox-vector-tile: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '204': {description: No tile here}
        '400': {description: 'invalid_request: unknown layer, or x or y outside the zoom level', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /tiles/public-tracks/{z}/{x}/{y}:
    get:
      operationId: getPublicTracksTile
      summary: 公开轨迹 (spec §2.8, ADR 0002) as a Mapbox Vector Tile, from z 11
      description: |
        One layer, public_tracks, of lines without attributes: each 公开轨迹 in WGS-84 (坐标纠偏 applied),
        with everything within 200 m of its start and its end left out. Never merged with OSM. A tile
        with no tracks is empty.
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 11, maximum: 16}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The tile
          headers:
            Cache-Control: {schema: {type: string}, description: 'a minute, so a withdrawn track soon disappears'}
          content: {application/vnd.mapbox-vector-tile: {schema: {type: string, format: binary}}}
        '400': {description: 'invalid_request: the zoom is outside 11–16, or x or y outside the zoom level', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /weather:
    post:
      operationId: postWeather
      summary: 沿途天气 (spec §2.9) for points along a track at their expected arrival times
      description: |
        Provider-neutral: 和风天气 (hourly forecast and official warnings) first, Open-Meteo for any cell
        和风 can't answer. Points are grouped into 0.01° cells; each cell is fetched at most once an hour
        and served from cache after that. Each device may ask for at most quotaCells cells per UTC day
        (daily_quota_exceeded past it). When no cell can be fetched the answer is data_unavailable.
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WeatherRequest'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Weather'}}}}
        '400': {description: 'invalid_request: no points, too many, or coordinates out of range', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: daily_quota_exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /search:
    get:
      operationId: getSearch
      summary: 搜索 (spec §2.10) online, for places the offline index doesn't have
      description: |
        Photon (OSM) first, biased towards lat/lon when given. When fewer than 5 places come back and the
        point is in China, 天地图地名搜索 adds its answers. Answers are cached for an hour. Coordinates and
        the 山名别名表 are handled in the app; the ranking too (Photon's order is only a starting point).
        When every provider fails the answer is data_unavailable.
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: lat, in: query, schema: {type: number, format: double}, description: 'the map centre; nearer places come first'}
        - {name: lon, in: query, schema: {type: number, format: double}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SearchResults'}}}}
        '400': {description: 'invalid_request: empty or too long q, or lat/lon out of range', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /auth/code:
    post:
      operationId: postAuthCode
      summary: Text a login code to a +86 number (spec §2.12, 阿里云号码认证 · 短信认证)
      description: |
        The code has 6 digits and is valid for 5 minutes; asking again replaces it. At most one code a
        minute and 10 a day per number, 30 a day per caller IP (sms_too_frequent past them).
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CodeRequest'}}}
      responses:
        '204': {description: Sent}
        '400': {description: 'invalid_request or invalid_phone', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: sms_too_frequent, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/SmsUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Log in (signing up on first use) with the texted code
      description: At most 10 tries an hour per number, right or wrong; past that every try is rate_limited.
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
        '400': {description: 'invalid_request, invalid_phone or wrong_code', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {$ref: '#/components/responses/SmsUnavailable'}
        '500': {$ref: '#/components/responses/Internal'}
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: End this token's session; the app keeps its local data (spec §2.12)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '204': {description: Logged out}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /me:
    get:
      operationId: getMe
      summary: The logged-in account
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    delete:
      operationId: deleteMe
      summary: 注销账号 (spec §2.12)
      description: |
        Deletes everything the server holds of the caller: account and sessions, synced tracks, 标注组, 标注 and
        photos, team memberships and positions, and their 队伍对话 photos. Their messages stay in the teams'
        对话 as 已注销用户, content removed. The phone keeps its local data.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /me/nickname:
    put:
      operationId: putMeNickname
      summary: 改昵称 (spec ux-v3 §8.4 第 5、8 条)
      description: |
        Stored trimmed. The caller's current team hears of it over its WebSocket (the Team with the new name), so
        teammates show it at once, older messages included; no system message is added.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NicknameRequest'}}}
      responses:
        '200': {description: Changed, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '400': {description: 'invalid_request: empty or over 12 characters', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /me/avatar:
    put:
      operationId: putMeAvatar
      summary: 换头像 (spec ux-v3 §8.4 第 6、8 条)
      description: |
        A JPEG at most 512 a side (the app sends 256×256). It gets a new id and the old one is deleted; it doesn't
        count toward the 1 GB of synced photos. The caller's current team hears of it as for /me/nickname.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {image/jpeg: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Changed, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '400': {description: 'invalid_request: not a JPEG, or too large', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    delete:
      operationId: deleteMeAvatar
      summary: 不用头像
      description: Back to the nickname's first character; the image is deleted and the team hears of it as for /me/nickname.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200': {description: Changed, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /avatars/{avatar}:
    get:
      operationId: getAvatar
      summary: A 头像, to any logged-in caller
      description: An id never changes its image, so the app caches by id; a replaced or dropped one is gone.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: avatar, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The JPEG
          headers:
            Cache-Control: {schema: {type: string}, description: 'private; avatars never change'}
          content: {image/jpeg: {schema: {type: string, format: binary}}}
        '404': {description: image_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /sync:
    get:
      operationId: getSync
      summary: Pull the caller's synced tracks, 标注组 and 标注 changed after a cursor (spec §2.12)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: after, in: query, schema: {type: integer, format: int64}, description: 'a Sync''s cursor; none for everything'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Sync'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    post:
      operationId: postSync
      summary: Push changes to the caller's tracks, 标注组 and 标注, all or nothing
      description: 'The body may be up to 32 MB (a long track''s points); everything else stays at 1 MB.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SyncChanges'}}}
      responses:
        '204': {description: Stored}
        '400': {description: 'invalid_request (a bad id, or a new one missing what it needs), or image_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /sync/photos:
    post:
      operationId: postSyncPhoto
      summary: Upload a 标注 photo, to set as its photo afterwards
      description: A JPEG shrunk as for /teams/{id}/images. Each account keeps at most 1 GB of them; a photo no 标注 uses any more is deleted.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {image/jpeg: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Photo'}}}}
        '400': {description: 'invalid_request: not a JPEG, or too large', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: photo_quota_exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /sync/photos/{photo}:
    get:
      operationId: getSyncPhoto
      summary: One of the caller's synced photos
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: photo, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The JPEG, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        '404': {description: image_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams:
    post:
      operationId: postTeam
      summary: Create a 队伍 (spec §2.11); the caller is its 发起人 and gets a 4-digit code to hand out
      description: A caller already in another active team leaves it first. The caller starts out sharing.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TeamRequest'}}}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/join:
    get:
      operationId: getTeamCard
      summary: The active team with this code, to look at before joining; changes nothing
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {name: code, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}$'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TeamCard'}}}}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    post:
      operationId: postTeamJoin
      summary: Join the active team with this code (any other active team is left first)
      description: Joining the team one is already in just answers it. A new member starts out sharing.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JoinRequest'}}}
      responses:
        '200': {description: Joined, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}:
    get:
      operationId: getTeam
      summary: The team, with the positions stored after `after`
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}, {$ref: '#/components/parameters/After'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/live:
    get:
      operationId: getTeamLive
      summary: WebSocket of the team's changes (spec §3.2, in-memory broadcast on the one server)
      description: |
        After the upgrade the server sends text messages, each a Team: first the team with positions after
        `after`, then one per change. A change carries the whole member list but only the new positions,
        so the app appends each message's positions to what it has (the first message's positions may
        repeat ones it already has: dedupe by member and time) and takes the rest as the latest state.
        The server pings every minute and drops clients that fall behind; reconnect with the last cursor.
        After 结束行程 the message has ended: true and the connection closes; the 队伍对话 carries on
        over REST (`GET /teams/{id}` with the cursor).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}, {$ref: '#/components/parameters/After'}]
      responses:
        '101': {description: Switching to WebSocket}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/positions:
    post:
      operationId: postTeamPositions
      summary: Report the caller's positions to the team
      description: |
        Live, one at a time; back from no signal, the latest first and then the thinned trail. Positions
        sent while not sharing are dropped.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Positions'}}}
      responses:
        '204': {description: Stored and sent to the team}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '409': {description: team_ended, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/sharing:
    put:
      operationId: putTeamSharing
      summary: 停止共享 (false) or share again (true); the caller stays in the team either way
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Sharing'}}}
      responses:
        '204': {description: Set}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '409': {description: team_ended, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/leave:
    post:
      operationId: postTeamLeave
      summary: 退出队伍; the caller's 尾迹 goes with them. The last one out ends the trip.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      responses:
        '204': {description: Left}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/end:
    post:
      operationId: postTeamEnd
      summary: 结束行程 (发起人 only); everyone stops sharing, the team stays for its 队伍对话
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      responses:
        '204': {description: Ended (or already was)}
        '403': {description: not_initiator, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/track:
    get:
      operationId: getTeamTrack
      summary: The 队伍轨迹 with its points (spec §2.11)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TeamTrack'}}}}
        '404': {description: 'team_not_found, or no_team_track', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    put:
      operationId: putTeamTrack
      summary: 指定, 更换 or 改起算点 of the 队伍轨迹 (发起人 only)
      description: |
        Replaces the snapshot, bumps its version and says so in the 队伍对话 (a system message), going out to
        the team's sockets like any change. The server deletes the snapshot at 结束行程.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TeamTrackRequest'}}}
      responses:
        '204': {description: Set}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: not_initiator, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '409': {description: team_ended, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
    delete:
      operationId: deleteTeamTrack
      summary: 取消 the 队伍轨迹 (发起人 only); members keep theirs
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      responses:
        '204': {description: 'Dropped (or there was none)'}
        '403': {description: not_initiator, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/messages:
    post:
      operationId: postTeamMessage
      summary: Send to the 队伍对话 (spec §2.11); goes out to the team's sockets like any change
      description: Allowed after 结束行程 too (the 对话 stays); not after 退出队伍. A resend with the same key gives back the message as first stored, without sending it out again.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MessageRequest'}}}
      responses:
        '200': {description: Stored and sent to the team, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        '400': {description: 'invalid_request, or image_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/images:
    post:
      operationId: postTeamImage
      summary: Upload a photo for an image message
      description: |
        A JPEG the app has already shrunk (long side 1600 px, about 300 KB; spec §3.2), at most 1 MB and
        2048 px a side. The server keeps it on disk with a thumbnail (long side 320 px); 180 days after
        结束行程 the original is deleted and only the thumbnail stays.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}, {$ref: '#/components/parameters/TeamId'}]
      requestBody:
        required: true
        content: {image/jpeg: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/Image'}}}}
        '400': {description: 'invalid_request: not a JPEG, or too large', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/TeamNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
  /teams/{id}/images/{image}:
    get:
      operationId: getTeamImage
      summary: A team photo, or its thumbnail (the thumbnail too once the original is gone)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/ClientVersion'}
        - {$ref: '#/components/parameters/TeamId'}
        - {name: image, in: path, required: true, schema: {type: string}}
        - {name: thumb, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: The JPEG
          headers:
            Cache-Control: {schema: {type: string}, description: 'private; images never change'}
          content: {image/jpeg: {schema: {type: string, format: binary}}}
        '404': {description: 'team_not_found or image_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '500': {$ref: '#/components/responses/Internal'}
