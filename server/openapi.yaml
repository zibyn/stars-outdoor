openapi: 3.1.0
info:
  title: Stars Outdoor API
  version: v1
  description: |
    Contract between the Android app (Kotlin) and the Go server (spec §3.2); the two share no code.
    Every path is under /v1. The app sends on every request:
    - `X-Device-Id`: an anonymous per-install ID, the key for rate limiting (falls back to the caller's IP).
    - `X-Client-Version`: its Android versionCode. Below `minClientVersion` every route except
      /v1/health and /v1/version answers 426; offline features never depend on the server.
      A request without the header is not gated (curl, monitoring), so the app must always send it:
      an app that forgets it can never be forced to update.
    Every future feature path lists both headers and the 429 and 426 responses.
servers:
  - url: /v1
components:
  parameters:
    DeviceId: {name: X-Device-Id, in: header, schema: {type: string}}
    ClientVersion: {name: X-Client-Version, in: header, schema: {type: integer}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [rate_limited, client_outdated, invalid_region, region_too_large, region_unsupported, daily_quota_exceeded, data_unavailable, internal]
        minClientVersion: {type: integer, description: set when error is client_outdated}
        maxAreaKm2: {type: integer, description: set when error is region_too_large}
        quotaBytes: {type: integer, description: set when error is daily_quota_exceeded}
  responses:
    RateLimited:
      description: Too many requests from this device in the current minute.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ClientOutdated:
      description: Client older than minClientVersion; the app shows "update required" on this online feature.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /health:
    get:
      summary: Liveness plus database/PostGIS reachability
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, postgis]
                properties:
                  status: {type: string, const: ok}
                  postgis: {type: string, description: postgis_lib_version()}
        '503':
          description: Database unreachable
          content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /version:
    get:
      summary: API version and the oldest client versionCode still served
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [api, minClientVersion]
                properties:
                  api: {type: string, const: v1}
                  minClientVersion: {type: integer}
        '429': {$ref: '#/components/responses/RateLimited'}
  /offline/version:
    get:
      summary: Version of the offline map data; packages downloaded under another version show "可更新"
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [version], properties: {version: {type: string}}}
        '500': {description: Clipping or signing failed (internal), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Source data unreadable (data_unavailable), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '426': {$ref: '#/components/responses/ClientOutdated'}
  /offline/packages:
    post:
      summary: Clip an offline package (spec §2.3) for a viewport or along a track
      description: |
        Give exactly one of `bbox` or `track`. A bbox snaps outward to 0.01°; a track is buffered by 2 km.
        The same area is clipped once per data version and served from cache after that. Limits: the
        area is at most maxAreaKm2 (100 × 100 km); each device downloads at most 1 GB per UTC day,
        charged when the URLs are handed out. Areas outside the data (China) are region_unsupported.
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/ClientVersion'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bbox: {type: array, items: {type: number}, minItems: 4, maxItems: 4, description: '[west, south, east, north], WGS-84'}
                track:
                  type: array
                  minItems: 2
                  maxItems: 5000
                  items: {type: array, items: {type: number}, minItems: 2, maxItems: 2, description: '[lon, lat]'}
      responses:
        '200':
          description: Signed download URLs, valid for 15 minutes
          content:
            application/json:
              schema:
                type: object
                required: [version, bytes, files]
                properties:
                  version: {type: string}
                  bytes: {type: integer}
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, url, bytes]
                      properties:
                        name: {type: string, enum: [basemap.pmtiles, dem.pmtiles, contours.pmtiles]}
                        url: {type: string}
                        bytes: {type: integer}
        '400': {description: invalid_region, region_too_large or region_unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: rate_limited or daily_quota_exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/ClientOutdated'}
        '503': {description: Source data unreadable (data_unavailable), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
