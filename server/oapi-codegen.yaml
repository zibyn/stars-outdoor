# go generate ./... → api/api.gen.go from openapi.yaml (ADR 0004)
package: api
output: api/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
compatibility:
  enable-auth-scopes-on-context: true # BearerAuthScopes marks the routes the auth middleware guards (ADR 0004)
