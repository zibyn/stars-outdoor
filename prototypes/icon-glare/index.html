<title>图标强光对比</title>
<!--
  PROTOTYPE — 一次性原型，勿并入 main。对应「原型：图标风格强光对比」(#78)。
  问题：Material Symbols 用线性还是填充、多粗、按钮要不要描边、图标多大，在户外强光下最好认？
  图标数据来自 google/material-design-icons（Apache 2.0）的 symbols/web，按粗细和填充各取一份。

<style>
/* 布局：顶部一排开关，下方是贴近真实的界面（地形底图 + B 方案按钮），或全部图标的网格 */
:root {
  --bg: #e3e8e2; --fg: #17231c; --bar-bg: #16201a; --bar-fg: #f2f5f1; --bar-on: #f2c14e; --bar-btn: #2c3a31;

  --ink: #17231c; --muted: #4f5e56; --panel: #ffffff; --go: #1f7a4d; --danger: #c62828; --me: #1a73e8; --line: #dfe5e0;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101512; --fg: #e6ece7; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #101512; --fg: #e6ece7; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--bar-on); outline-offset: 2px; }
.proto { flex: none; background: var(--bar-bg); color: var(--bar-fg); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.grp { display: flex; gap: 4px; align-items: center; }
.grp > span { opacity: .7; margin-right: 2px; }
.proto button { background: var(--bar-btn); color: var(--bar-fg); border: 0; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
.proto button.on { background: var(--bar-on); color: #16201a; font-weight: 600; }
.cap { flex: none; background: var(--bar-bg); color: var(--bar-fg); padding: 0 16px 8px; font-size: 13px; opacity: .85; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 12px 16px; }
.phone { position: relative; width: 390px; max-width: 100%; height: 100%; max-height: 844px; border-radius: 24px; overflow: hidden; border: 6px solid #0d120f; color: var(--ink); background: #eef0e4; }
@media (max-width: 500px) { .stage { padding: 8px 16px; } .phone { border-width: 0; border-radius: 14px; } }
.glare .phone > * { filter: brightness(1.35) contrast(.62) saturate(.7); }
#bgmap { position: absolute; inset: 0; width: 100%; height: 100%; }
.i { display: block; fill: currentColor; }
.b { position: absolute; width: 56px; height: 56px; border-radius: 16px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 12px; font-weight: 600; border: 0; }
.outline .b { border: 1.5px solid rgba(23,35,28,.35); }
.b.on { background: var(--me); color: #fff; }
.col { position: absolute; display: flex; flex-direction: column; gap: 12px; }
.col .b { position: static; }
.top { position: absolute; left: 0; right: 0; top: 0; background: var(--panel); border-radius: 0 0 18px 18px; padding: 12px; display: flex; gap: 8px; align-items: center; }
.search { flex: 1; height: 52px; border-radius: 14px; background: #eef2ef; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); font-size: 15px; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 20px 20px 0 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 8px 6px 14px; box-shadow: 0 -3px 16px rgba(0,0,0,.14); }
.tab { width: 64px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 600; }
.startc { width: 84px; height: 84px; border-radius: 50%; background: var(--go); color: #fff; border: 5px solid #fff; margin-top: -40px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.cockpit { position: absolute; left: 0; right: 0; top: 0; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 0 0 20px 20px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-variant-numeric: tabular-nums; }
.cockpit b { display: block; font: 700 28px/1.1 var(--num); }
.cockpit span { font-size: 12px; color: #b8c6bd; }
.keys { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-radius: 20px 20px 0 0; display: flex; gap: 10px; padding: 14px 12px 16px; box-shadow: 0 -3px 16px rgba(0,0,0,.14); }
.key { flex: 1; min-height: 92px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 16px; }
.key.sos { background: var(--danger); color: #fff; }
.key.dark { background: var(--ink); color: #fff; }
.key.plain { background: #eef2ef; border: 1.5px solid var(--line); }
.pill { position: absolute; background: var(--panel); border-radius: 14px; min-height: 52px; padding: 0 14px; font-weight: 700; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: flex; align-items: center; gap: 6px; }
.outline .pill { border: 1.5px solid rgba(23,35,28,.35); }
.me { position: absolute; left: 50%; top: 52%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
.grid { position: absolute; inset: 0; overflow: auto; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
.cell { background: rgba(255,255,255,.0); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--ink); text-align: center; }
.cell .b { position: static; }
.cell .lbl { background: rgba(255,255,255,.8); border-radius: 6px; padding: 0 4px; }
.gridhead { grid-column: 1 / -1; font-weight: 700; font-size: 13px; background: rgba(255,255,255,.85); border-radius: 8px; padding: 4px 8px; }
</style>

function drawMap() {
  const c = document.getElementById('bgmap'), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;

  const g = c.getContext('2d'); g.scale(dpr, dpr);

  g.fillStyle = 'rgba(200,222,184,.7)'; g.beginPath(); g.ellipse(r.width * .2, r.height * .75, 180, 140, .4, 0, 7); g.fill();

    for (let i = 1; i <= n; i++) {
