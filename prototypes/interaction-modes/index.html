// ============ 地图绘制（世界坐标 1400×1800） ============
const world = document.getElementById('world');
const d = pts => 'M' + pts.map(p => p.join(',')).join('L');
function contours(cx, cy, rx, ry, n, seed) {
  let s = '';
  for (let i = 1; i <= n; i++) {
    const pts = [];
    for (let a = 0; a <= 64; a++) {
      const t = a / 64 * Math.PI * 2, w = 1 + .09 * Math.sin(3 * t + seed + i * .4) + .05 * Math.sin(5 * t + i);
      pts.push([(cx + Math.cos(t) * rx * i / n * w).toFixed(1), (cy + Math.sin(t) * ry * i / n * w).toFixed(1)]);
    }
    s += `<path d="${d(pts)}Z" fill="none" stroke="#a08c62" stroke-opacity="${i % 5 ? .35 : .6}" stroke-width="${i % 5 ? 1.2 : 2}"/>`;
  }
  return s;
}
const line = (pts, c, w, extra = '') => `<path d="${d(pts)}" fill="none" stroke="#fff" stroke-width="${w + 4}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d(pts)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
function drawWorld() {
  const baseBg = { topo: '#eef0e4', sat: '#5f6f55', std: '#f4f3ef' }[st.base];
  let s = `<rect width="1400" height="1800" fill="${baseBg}"/>`;
  if (st.base !== 'sat') s += `<path d="M0,1000 C200,950 300,1150 480,1100 S700,1300 900,1250 L900,1800 L0,1800Z" fill="#d7e6c9" opacity=".7"/><path d="M1400,200 C1200,300 1150,150 1000,250 S900,100 800,0 L1400,0Z" fill="#d7e6c9" opacity=".7"/>`;
  s += contours(900, 430, 520, 380, 14, 1) + contours(360, 1320, 420, 360, 11, 3);
  s += `<path d="M0,1600 C300,1500 500,1650 800,1560 S1200,1400 1400,1480" fill="none" stroke="#6aa9d8" stroke-width="5"/>`;
  // 层级：周边路网（淡）< 队友尾迹 < 叠加 < 参考 < 记录
  if (st.road) s += ROADS.map(r => `<path d="${d(r)}" fill="none" stroke="#7b6f5f" stroke-opacity=".45" stroke-width="2.2" stroke-dasharray="6 5"/>`).join('');
  if (st.mates) s += MATES.map(m => `<path d="${d(m.trail)}" fill="none" stroke="${m.c}" stroke-opacity=".7" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>`).join('');
  st.ovl.forEach(id => { const t = TRACKS.find(t => t.id === id); if (t && !t.ref) s += line(t.pts, PAL[st.color[id]], 4); });
  s += line(TRACKS[0].pts, 'var(--ref)', 7);
  if (st.mode === 'act' || st.recDone) s += line(REC, 'var(--rec)', 6);
  world.innerHTML = s;
}

const phone = document.getElementById('phone'), ui = document.getElementById('ui');
const W = () => phone.clientWidth, H = () => phone.clientHeight;
function toScreen(x, y) {
  const r = -st.rot * Math.PI / 180, dx = x - st.cx, dy = y - st.cy;
  return [W() / 2 + dx * Math.cos(r) - dy * Math.sin(r), H() / 2 + dx * Math.sin(r) + dy * Math.cos(r)];
}
function applyCam() {
  world.style.transform = `translate(${W() / 2}px,${H() / 2}px) rotate(${-st.rot}deg) translate(${-st.cx}px,${-st.cy}px)`;
  ui.querySelectorAll('.mk').forEach(el => {
    const [x, y] = toScreen(+el.dataset.x, +el.dataset.y);
    el.style.transform = `translate(${x}px,${y}px)`;
    if (el.dataset.cone) el.firstChild.style.transform = `rotate(${HEADING - st.rot}deg)`;
  });
  const c = ui.querySelector('.compass svg'); if (c) c.style.transform = `rotate(${-st.rot}deg)`;
}
let anim = 0;
function camTo(cx, cy, rot = st.rot, ms = 300) {
  cancelAnimationFrame(anim);
  const k = st.speed, a = { cx: st.cx, cy: st.cy, rot: st.rot }, t0 = performance.now(), dur = ms * k;
  if (!dur) { Object.assign(st, { cx, cy, rot }); return applyCam(); }
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); // 减速曲线：快起、稳停
    st.cx = a.cx + (cx - a.cx) * e; st.cy = a.cy + (cy - a.cy) * e; st.rot = a.rot + (rot - a.rot) * e;
    applyCam(); if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

    <div class="row"><div class="t"><b>队伍内共享</b><span>${st.share ? '队友能看到你的位置，每 30 秒更新' : '已停止共享，队友看到的是你最后的位置'}</span></div><button class="sw ${st.share ? 'on' : ''}" data-act="toggleShare" aria-label="队伍内共享"></button></div>
    <div class="sec">发坐标给别人</div><div class="coord">34.0141° N, 107.4523° E<br>海拔 2310 m · 精度 8 m</div>
    <div class="btns"><button class="big dark" data-act="copy">复制坐标</button></div>`,
  lost: () => `<h3 style="color:var(--danger)">老周 失联 12 分钟<button class="x" data-act="close">${I.close}</button></h3>
    <p style="margin:0;color:var(--muted)">这是他最后一次上报的位置。可能只是没信号，先原地联系。</p>
    <div class="coord">34.0102° N, 107.4411° E<br>海拔 2180 m · 电量 18% · 13:52</div>
    <div class="btns"><button class="big dark" data-act="copy">复制坐标</button><button class="big plain" data-act="chat">在对话里找他</button></div>`,
  sos: () => `<h3 style="color:var(--danger)">求助已发出</h3><p style="margin:0 0 4px">已通知队伍里 3 人。他们会看到你的位置，每 30 秒更新一次。</p><p style="margin:0;color:var(--muted)">求助只发给队友，不会联系救援机构。</p>
    <div class="btns"><button class="big plain" data-act="share">${I.share}分享位置</button><button class="big dark" data-act="cancelSos">取消求助</button></div>`,
  detail: () => {
    const t = st.detail === 99 ? { id: 99, name: '今天 14:32 的记录', kind: '记录', km: 5.62, up: 486, date: '今天' } : TRACKS.find(t => t.id === st.detail);
    const on = t.ref || st.ovl.includes(t.id);
    return `<h3>${t.name}<button class="x" data-act="close">${I.close}</button></h3>
    <div class="stats"><div><b>${t.km}</b><span>公里</span></div><div><b>${t.up}</b><span>爬升 m</span></div><div><b>${t.kind}</b><span>类型</span></div><div><b>${t.date}</b><span>日期</span></div></div>
    <svg viewBox="0 0 300 60" style="width:100%;height:60px;margin-top:8px"><path d="M0,55 L30,48 60,40 90,30 120,34 150,20 180,12 210,18 240,8 270,14 300,6 L300,60 L0,60Z" fill="#dfe8e2"/><path d="M0,55 L30,48 60,40 90,30 120,34 150,20 180,12 210,18 240,8 270,14 300,6" fill="none" stroke="#17231c" stroke-width="2"/></svg>
    <div class="btns">${t.ref ? '<button class="big plain" disabled>参考中</button>' : t.id === 99 ? '' : `<button class="big ${on ? 'dark' : 'plain'}" data-act="ovl:${t.id}">${on ? '取消叠加' : '叠加'}</button>`}<button class="big plain" data-act="setref">设为参考</button><button class="big plain" data-act="offline">${I.dl}沿线下载</button></div>`;
  },
  supp: () => `<h3>补充标注<button class="x" data-act="close">${I.close}</button></h3>
    <div class="search">名称（可不填）</div><div class="btns"><button class="big plain" data-act="noop">拍照</button><button class="big plain" data-act="noop">备注</button></div><div class="btns"><button class="big dark" data-act="close">保存</button></div>`,
  menu: () => `<h3>菜单<button class="x" data-act="close">${I.close}</button></h3>
    ${[['tracks', I.route, '我的轨迹'], ['team', I.team, '队伍 · 3 人'], ['offline', I.dl, '离线地图'], ['settings', I.gear, '设置']].map(([a, i, n]) => `<div class="row" data-act="${a}" style="cursor:pointer"><span style="width:26px">${i}</span><div class="t"><b>${n}</b></div></div>`).join('')}`,
};
function sheetHTML() {
  if (!st.sheet) return '';
  const tall = st.sheet === 'tracks' || st.sheet === 'layers';
  return `<div class="sheet ${tall ? 'tall' : ''} ${st.sheet !== lastSheet ? 'enter' : ''}"><div class="grab"></div>${SHEETS[st.sheet]()}</div>`;
}
function pageHTML() {
  if (st.page !== 'tracks') return '';
  return `<div class="page ${lastPage !== 'tracks' ? 'enter' : ''}"><header><button class="x" data-act="back" aria-label="返回">${I.back}</button>我的轨迹</header><div class="body"><div class="search">${I.search}搜索我的轨迹</div><div class="sec">最近</div>${trackRows()}</div></div>`;
}

// ============ 渲染 ============
let lastSheet = null, lastPage = null, lastMode = st.mode;
function render() {
  drawWorld();
  let h = markers() + V[st.v]() + compass();
  if (st.sos && st.sheet !== 'sos') h += `<button class="banner" data-act="sosSheet" style="top:${TOPBAR() && st.mode === 'act' ? 138 : st.v === 'C' && st.mode === 'act' ? 84 : 12}px">求助中 · 已通知 3 人 · 点这里查看</button>`;
  if (st.snack && !st.fan) h += `<div class="snack" style="bottom:${st.sheet ? 12 : SNACK_BOTTOM}px"><span class="t">${st.snack.t}</span>${(st.snack.a || []).map(([n, a]) => `<button data-act="${a}">${n}</button>`).join('')}</div>`;
  h += sheetHTML() + pageHTML();
  ui.innerHTML = h;
  if (st.mode !== lastMode) { ui.classList.remove('fade'); void ui.offsetWidth; ui.classList.add('fade'); }
  lastSheet = st.sheet; lastPage = st.page; lastMode = st.mode; st.justMarked = false;
  applyCam(); renderProto();
}

let snackT = 0;
function snack(t, a, ms = 5000) { st.snack = { t, a }; clearTimeout(snackT); snackT = setTimeout(() => { st.snack = null; render(); }, ms); }

// ============ 动作 ============
function act(a) {
  const [k, arg] = a.split(':');
  if (k === 'fan') { st.fan = !st.fan; return render(); }
  st.fan = false;
  switch (k) {
    case 'loc':
      if (st.follow === 0) { st.follow = 1; camTo(ME[0], ME[1], 0); }
      else if (st.follow === 1) { st.follow = 2; camTo(ME[0], ME[1], HEADING); }
      else { st.follow = 1; camTo(ME[0], ME[1], 0); }
      break;
    case 'north': camTo(st.cx, st.cy, 0); setTimeout(render, 320 * st.speed); break;
    case 'mark': {
      const at = st.follow ? [...ME] : [Math.round(st.cx), Math.round(st.cy)];
      st.marks.push(at); st.justMarked = true;
      snack(st.follow ? '已标注当前位置 · 海拔 2310 m' : '已标注十字处', [['撤销', 'undo'], ['补充', 'supp']], 6000);
      break;
    }
    case 'undo': st.marks.pop(); st.snack = null; break;
    case 'supp': st.snack = null; st.sheet = 'supp'; break;
    case 'layers': case 'team': case 'share': case 'lost': case 'menu':
      st.sheet = k; st.page = null;
      if (k === 'lost') { const m = MATES[2]; st.follow = 0; camTo(m.at[0], m.at[1] + 120); }
      break;
    case 'tracks': if (TRACKS_AS_PAGE()) { st.page = 'tracks'; st.sheet = null; } else st.sheet = 'tracks'; break;
    case 'back': st.page = null; break;
    case 'close': st.sheet = null; break;
    case 'sosSheet': st.sheet = 'sos'; break;
    case 'offline': snack('离线地图：整页（框选范围 → 命名 → 下载进度）。本原型不展开。'); break;
    case 'settings': snack('设置：整页。本原型不展开。'); break;
    case 'chat': snack('队伍对话：半屏抽屉，上拉全屏（沿用旧决定）。本原型不展开。'); break;
    case 'copy': snack('已复制坐标'); break;
    case 'noop': break;
    case 'base': st.base = arg; break;
    case 'road': st.road = !st.road; break;
    case 'mates': st.mates = !st.mates; break;
    case 'toggleShare': st.share = !st.share; snack(st.share ? '已开始共享位置' : '已停止共享位置'); break;
    case 'ovl': {
      const id = +arg;
      if (st.ovl.includes(id)) { st.ovl = st.ovl.filter(x => x !== id); delete st.color[id]; }
      else if (st.ovl.length >= 6) snack('最多叠加 6 条。先关掉一条再加。');
      else { const used = Object.values(st.color); st.color[id] = PAL.findIndex((_, i) => !used.includes(i)); st.ovl.push(id); }
      break;
    }
    case 'detail': {
      st.detail = +arg; st.page = null; st.sheet = 'detail'; st.follow = 0;
      const t = TRACKS.find(t => t.id === +arg), m = t.pts[Math.floor(t.pts.length / 2)];
      camTo(m[0], m[1] + 160);
      break;
    }
    case 'setref': snack('已设为参考轨迹（偏离 50 m 时提醒）'); break;
    case 'goto': { const m = MATES.find(m => m.id === arg); st.sheet = m.lost ? 'lost' : null; st.follow = 0; camTo(m.at[0], m.at[1] + (m.lost ? 120 : 0)); break; }
    case 'start': st.mode = 'act'; st.paused = false; st.sheet = null; st.page = null; st.recDone = false; st.follow = 1; camTo(ME[0], ME[1], st.rot); snack('开始记录 · 队友能看到你的位置'); break;
    case 'pause': st.paused = true; snack('已暂停。按住「结束」保存。'); break;
    case 'resume': st.paused = false; st.snack = null; break;
    case 'cockpit': st.cockpitPg = 1 - st.cockpitPg; break;
    case 'cancelSos': st.sos = false; st.sheet = null; snack('已取消求助，已告诉队友'); break;
    default: return;
  }
  render();
}
function hold(a) {
  if (a === 'sos') { st.sos = true; st.sheet = 'sos'; }
  if (a === 'end') { st.mode = 'plan'; st.paused = false; st.recDone = true; st.detail = 99; st.sheet = 'detail'; snack('已保存，共 5.62 km'); }
  render();
}

// 点击
phone.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act); });
// 按住类按钮
let holdT = 0;
phone.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]'); if (!el) return;
  el.classList.add('holding');
  const ms = parseFloat(getComputedStyle(el).getPropertyValue('--hold')) * 1000;
  holdT = setTimeout(() => hold(el.dataset.hold), ms);
  const stop = () => { clearTimeout(holdT); el.classList.remove('holding'); el.removeEventListener('pointerup', stop); el.removeEventListener('pointerleave', stop); };
  el.addEventListener('pointerup', stop); el.addEventListener('pointerleave', stop);
});
// 拖地图：退出跟随，保持当前朝向
const mapEl = document.getElementById('map');
let drag = null;
mapEl.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; mapEl.setPointerCapture(e.pointerId); cancelAnimationFrame(anim); });
mapEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  if (!drag.moved && st.follow) { st.follow = 0; drag.moved = true; render(); }
  drag.moved = true;
  const r = st.rot * Math.PI / 180;
  st.cx -= dx * Math.cos(r) - dy * Math.sin(r); st.cy -= dx * Math.sin(r) + dy * Math.cos(r);
  drag.x = e.clientX; drag.y = e.clientY; applyCam();
});
mapEl.addEventListener('pointerup', () => { if (drag && !drag.moved && (st.sheet || st.page || st.fan)) { st.sheet = null; st.fan = false; render(); } drag = null; });
addEventListener('resize', applyCam);

// ============ 原型控制条 ============
const NOTES = {
  D: `<h4>D · 融合（B + C）</h4>
    <p><b>规划</b>：顶部搜索和图层，下面是参考轨迹摘要。惯用手下角是「开始」主按钮，点一下展开功能弧：开始记录（离拇指最近）、我的轨迹（整页）、队伍（抽屉）、离线地图、设置。定位和标注常驻在主按钮上方，不收进弧里。</p>
    <p><b>活动</b>：顶部深色大字数据，点一下翻页。主按钮显示「记录 2:14」，点开是暂停、队伍、分享位置、图层；暂停后弧上有「继续」和「按住结束」。求助带文字，固定在另一侧下角，按住 1.5 秒。</p>
    <p><b>取舍</b>：开始记录和暂停都要点两下，换来首屏干净、不会误触；标注、定位、求助始终一下就能按到。</p>`,
  A: `<h4>A · 地图 + 常驻底部抽屉</h4>
    <p><b>做法</b>：底部抽屉一直露出一截，放当前情境最需要的东西。规划时是搜索、入口和「开始记录」；活动时是数据、暂停、分享位置和求助。地图按钮在惯用手一侧竖排。队伍、我的轨迹、图层、详情都在抽屉里打开。</p>
    <p><b>优点</b>：只有一种容器，学一次就会；地图一直可见；和 Gaia、Komoot、Material 3 标准抽屉一致。</p>
    <p><b>缺点</b>：抽屉常驻占掉约四分之一屏，活动时更高；大按钮和数据挤在同一块里，按钮做不到最大；我的轨迹这种长列表放抽屉里偏挤。</p>
    <p><b>适合</b>：规划和看信息多、活动中也常看数据的人。</p>`,
  B: `<h4>B · 规划 / 活动分离（推荐）</h4>
    <p><b>做法</b>：同一张地图，两种界面。规划状态信息多：顶部搜索和参考轨迹摘要，底部带文字的入口栏和大「开始」；队伍用半屏抽屉，我的轨迹用整页。开始记录后换成活动状态：顶部深色大字数据（点一下翻页），底部三个大键「标注 / 暂停 / 求助」，分享位置和队伍是带字的按钮，其余全部收起。</p>
    <p><b>优点</b>：活动界面专为手套、单手、强光设计，按钮最大、最少；规划界面不必为此牺牲信息量；安全动作在活动状态里始终可见；左右手只需对调底部三个键和定位列。</p>
    <p><b>缺点</b>：两套布局，开始和结束时按钮位置会变，靠短淡入交代；不记录只看图时，用的是规划界面，按钮较小（仍 ≥ 56 dp）。</p>
    <p><b>适合</b>：本项目的前提：出发前和路上差别很大。</p>`,
  C: `<h4>C · 单手拇指弧</h4>
    <p><b>做法</b>：所有按钮围着惯用手下角的主按钮排成一道弧，上半屏只留地图。其余入口收进「菜单」，队伍、我的轨迹都是半屏抽屉。活动时菜单位换成队伍，另一侧下角是分享位置和求助。</p>
    <p><b>优点</b>：单手最顺，不用换手；首屏最干净，地图面积最大。</p>
    <p><b>缺点</b>：按钮扎堆，戴手套容易误触；弧形位置不如一行直观；首屏入口少，规划时要多点一层菜单；换手要整块镜像。</p>
    <p><b>适合</b>：以单手边走边用为主、很少在 App 里做规划的人。</p>`,
};
const proto = document.getElementById('proto'), note = document.getElementById('note');
function renderProto() {
  const seg = (label, opts, cur, key) => `<div class="grp"><span>${label}</span>${opts.map(([v, n]) => `<button class="${cur === v ? 'on' : ''}" data-p="${key}:${v}">${n}</button>`).join('')}</div>`;
  proto.innerHTML = seg('模式', Object.entries(VNAMES).map(([k, n]) => [k, `${k} ${n}`]), st.v, 'v')
    + seg('状态', [['plan', '规划'], ['act', '活动']], st.mode, 'mode')
    + seg('惯用手', [['R', '右手'], ['L', '左手']], st.hand, 'hand')
    + seg('动画', [['1', '正常'], ['4', '慢放 ×4'], ['0', '关']], String(st.speed), 'speed')
    + `<div class="grp"><button class="${st.note ? 'on' : ''}" data-p="note:1">说明与优劣</button></div>`;
  note.hidden = !st.note; note.innerHTML = NOTES[st.v];
  document.documentElement.style.setProperty('--k', st.speed);
}
proto.addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const [k, v] = b.dataset.p.split(':');
  if (k === 'v') { st.fan = false; st.v = v; st.sheet = null; st.page = null; try { history.replaceState(null, '', '#' + v); } catch (e) {} }
  if (k === 'mode') { st.fan = false; st.mode = v; st.sheet = null; st.page = null; st.paused = false; }
  if (k === 'hand') st.hand = v;
  if (k === 'speed') st.speed = +v;
  if (k === 'note') st.note = !st.note;
  render();
});
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  const ks = Object.keys(VNAMES), i = ks.indexOf(st.v);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { st.v = ks[(i + (e.key === 'ArrowRight' ? 1 : ks.length - 1)) % ks.length]; st.sheet = null; st.page = null; render(); }
});
render();
</script>
