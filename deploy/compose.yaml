# Dev server on the LAN (ADR 0003): API + PostGIS + RustFS standing in for the HK VPS and OSS.
# Deployment, backups, restore: deploy/README.md
# cp .env.example .env, fill it in, then: docker compose up -d
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: stars
      POSTGRES_USER: stars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [db:/var/lib/postgresql/data]

  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["${S3_PORT:-9000}:9000", "${S3_CONSOLE_PORT:-9001}:9001"] # S3 API, web console
    volumes: [s3:/data]

  api:
    build: ../server
    restart: unless-stopped
    depends_on: [db]
    environment: # only what the API uses: the container never sees third-party secrets it doesn't need
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      PGHOST: db
      PGUSER: stars
      PGDATABASE: stars
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Offline packages: signed download URLs carry this host, so phones must reach it (not `s3`).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      TIANDITU_KEY: ${TIANDITU_KEY:-} # 卫星 and 标准 cards (/v1/tiles/tianditu) and 地名搜索 (/v1/search)
      PHOTON_URL: ${PHOTON_URL:-} # 搜索: empty = the public photon.komoot.io
      # 沿途天气 (/v1/weather): 和风 JWT credentials; no host = Open-Meteo only.
      QWEATHER_HOST: ${QWEATHER_HOST:-}
      QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:-}
      QWEATHER_KEY_ID: ${QWEATHER_KEY_ID:-}
      QWEATHER_PRIVATE_KEY_PATH: ${QWEATHER_PRIVATE_KEY_PATH:-}
      # 登录验证码 (阿里云号码认证 · 短信认证)
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
    volumes: ["./certs:/app/certs:ro"] # the image runs as nonroot (65532): the .pem must be readable by it
    ports: ["${API_PORT:-8080}:8080"]

volumes:
  db:
  s3:
