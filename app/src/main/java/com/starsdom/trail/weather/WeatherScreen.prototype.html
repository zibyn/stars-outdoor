<!doctype html>
<!--
  PROTOTYPE, throwaway (#245 天气页专业数据的呈现). Not shipped; not built by Gradle.
  Three variants of 天气页 (ADR 0011 layout) with the new 专业数据, switchable via ?variant=A|B|C or ←/→.
  Mock data: 武功山金顶 地点海拔 1918 m, 格点地面 1210 m. Toggles in the bar flip 预警失败 / 可信度暂缺 / 不在高处.
  Open it in a browser (phone width, or devtools' device mode).
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气页原型</title>
<style>
  :root { --bg:#fbfcfe; --on:#1a1c1e; --sub:#5d6066; --line:#d9dce1; --pri:#2f6bd1; --err:#c62828; --errc:#fde7e7;
    --rain:#2e7dd7; --sun:#f2a100; --cloud:#8c96a3; --nightc:#5c6bc0; --shade:#e8ecf2; --card:#f0f2f6; --ok:#2e7d32; --mid:#ef8f00; }
  * { box-sizing:border-box; }
  body { margin:0; background:#c9ced6; font:15px/1.4 system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif; color:var(--on); }
  .phone { width:390px; max-width:100%; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:140px; position:relative; overflow:hidden; }
  .top { display:flex; align-items:center; height:56px; padding:0 16px 0 8px; gap:8px; font-size:22px; }
  .top b { font-weight:400; flex:1; }
  .sub { color:var(--sub); font-size:13px; }
  .pad { padding:0 16px; }
  .now { display:flex; align-items:center; gap:12px; padding:8px 16px; }
  .now .big { font-size:40px; }
  .ico { font-size:26px; width:36px; text-align:center; }
  .alert { margin:12px 16px 0; background:var(--errc); border-radius:8px; padding:10px 12px; font-size:14px; }
  .alert small { display:block; color:#8a2b2b; margin-top:4px; }
  .muted-box { margin:8px 16px 0; padding:8px 12px; border:1px dashed var(--line); border-radius:8px; color:var(--sub); font-size:13px; }
  .days { display:flex; padding:12px 8px; }
  .day { flex:1; margin:0 2px; padding:8px 0; border-radius:8px; text-align:center; cursor:pointer; position:relative; border:1px solid transparent; }
  .day.sel { background:rgba(47,107,209,.08); border-color:var(--pri); }
  .day .n { font-size:14px; } .day.sel .n { color:var(--pri); }
  .day .d { font-size:11px; color:var(--sub); }
  .day .p { font-size:11px; color:var(--rain); min-height:15px; }
  .dot { position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--err); }
  .conf { font-size:10px; border-radius:4px; padding:0 3px; display:inline-block; margin-top:2px; }
  .conf.mid { color:var(--mid); border:1px solid var(--mid); } .conf.low { color:var(--err); border:1px solid var(--err); }
  .confbar { height:3px; border-radius:2px; margin:4px 10px 0; }
  .dayhead { display:flex; align-items:center; padding:0 16px; gap:8px; }
  .dayhead .t { flex:1; }
  .line { padding:4px 16px; font-size:13px; color:var(--sub); }
  .line.warn { color:var(--err); }
  .gram { display:flex; padding:8px 0; }
  .heads { width:44px; flex:none; }
  .heads div { display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--sub); text-align:center; line-height:1.1; }
  .heads span { font-size:16px; }
  .scroll { overflow-x:auto; flex:1; }
  .cols { position:relative; }
  .row { display:flex; }
  .cell { width:52px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; }
  .cell.red, .red { color:var(--err); }
  .tag { font-size:11px; border-radius:10px; padding:1px 6px; }
  .tag.高 { background:#d7ecd9; color:#1b5e20; } .tag.中 { background:#fff0d1; color:#8a5a00; } .tag.低 { background:#eef0f3; color:var(--sub); }
  .thunder.高 { color:var(--mid); font-weight:700; } .thunder.中 { color:var(--mid); }
  .attr { padding:24px 16px 8px; font-size:11px; color:var(--sub); }
  .attr a { color:var(--sub); }
  .seg { display:flex; margin:8px 16px; border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .seg button { flex:1; border:0; background:none; padding:8px 0; font:inherit; font-size:14px; cursor:pointer; }
  .seg button.on { background:rgba(47,107,209,.12); color:var(--pri); }
  .cards { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 8px; }
  .chip { flex:none; width:150px; background:var(--card); border-radius:12px; padding:10px 12px; cursor:pointer; }
  .chip h4 { margin:0; font-size:12px; color:var(--sub); font-weight:400; }
  .chip p { margin:4px 0 0; font-size:15px; }
  .chip small { color:var(--sub); font-size:12px; }
  .chip.warn p { color:var(--err); }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:5; }
  .sheet { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:390px; max-width:100%; background:var(--bg); border-radius:16px 16px 0 0; padding:12px 16px 120px; z-index:6; display:none; }
  .sheet.on, .sheet-bg.on { display:block; }
  .grab { width:32px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 12px; }
  .sec { margin-top:16px; padding:0 16px; font-size:16px; }
  .hint { font-size:12px; color:var(--sub); padding:2px 16px; }
  /* prototype chrome */
  .bar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#111; color:#fff; border-radius:24px; padding:6px 10px; z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:0 4px 16px rgba(0,0,0,.4); font-size:13px; }
  .bar .r { display:flex; align-items:center; gap:10px; }
  .bar button { background:#333; color:#fff; border:0; border-radius:14px; padding:4px 10px; cursor:pointer; font:inherit; }
  .bar label { display:flex; gap:3px; align-items:center; font-size:12px; }
  .state { position:fixed; top:8px; right:8px; background:#111; color:#9f9; font:11px monospace; padding:6px 8px; border-radius:6px; z-index:10; max-width:260px; white-space:pre-wrap; }
  @media (max-width:900px) { .state { display:none; } }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div class="sheet-bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="state" id="state"></div>
<div class="bar">
  <div class="r"><button onclick="cycle(-1)">←</button><span id="vlabel"></span><button onclick="cycle(1)">→</button></div>
  <div class="r">
    <label><input type="checkbox" id="tAlertFail" onchange="render()">预警失败</label>
    <label><input type="checkbox" id="tConfNA" onchange="render()">可信度暂缺</label>
    <label><input type="checkbox" id="tLow" onchange="render()">不在高处</label>
  </div>
</div>
<script>
const VARIANTS = { A: '加行：气象图往下长', B: '分层：剖面图 + 切换', C: '要点卡片 + 按小时抽屉' };
const PLACE_ELE = 1918, GROUND = 1210;
const LEVELS = [[1000,110],[975,330],[950,540],[925,760],[900,990],[850,1460],[800,1950],[700,3010],[600,4200],[500,5570]];
const NAMES = ['今天','周三','周四','周五','周六','周日','周一'];
// Each day's story: base temp at the place, freezing level, morning inversion / cloud sea, afternoon CAPE, rain, wind, confidence.
const DAYS = [
  { base:9,  fz:3600, sea:'中', top:1750, cape:200,  rain:0,  wind:6,  sky:'多云', conf:['高',[]] },
  { base:11, fz:3800, sea:'高', top:1650, cape:300,  rain:0,  wind:4,  sky:'晴',   conf:['高',[]] },
  { base:12, fz:3900, sea:null, top:null, cape:1600, rain:6,  wind:9,  sky:'多云', conf:['中',['降水']], thunder:true },
  { base:5,  fz:2600, sea:null, top:null, cape:100,  rain:12, wind:19, sky:'雨',   conf:['低',['降水','阵风']] },
  { base:-1, fz:1700, sea:'中', top:1500, cape:0,    rain:0,  wind:8,  sky:'晴',   conf:['中',['气温']] },
  { base:3,  fz:2300, sea:'低', top:1400, cape:0,    rain:0.5,wind:6,  sky:'阴',   conf:['高',[]] },
  { base:6,  fz:3000, sea:null, top:null, cape:300,  rain:0,  wind:5,  sky:'多云', conf:['低',['气温']] },
];
const NOW_HOUR = 5; // 现在 is 05:00 on 今天
let rnd = 7; const r = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;

function hoursOf(di) {
  const D = DAYS[di], out = []; rnd = 7 + di * 13;
  for (let h = di === 0 ? NOW_HOUR : 0; h < 24; h++) {
    const night = h < 6 || h >= 18, dawn = h >= 4 && h <= 9, aft = h >= 13 && h <= 18;
    const temp = D.base + 5 * Math.sin((h - 9) / 24 * 2 * Math.PI) + (r() - .5);
    const gust = Math.max(2, D.wind + (aft ? 3 : 0) + (r() - .5) * 3);
    const feels = temp - gust * 0.35;
    const precip = D.rain ? (aft || D.rain > 10 ? D.rain * (0.1 + r() * 0.4) : r() < .3 ? .4 : 0) : 0;
    const thunder = !!D.thunder && aft && h >= 14 && h <= 17;
    const capeLvl = D.cape * (aft ? 1 : .15) > 1000 ? '高' : D.cape * (aft ? 1 : .15) > 300 ? '中' : '低';
    const sea = tLow() ? null : D.sea && dawn ? (h >= 5 && h <= 8 ? D.sea : '低') : null;
    const low = sea ? 85 : D.rain ? 90 : D.sky === '阴' ? 70 : D.sky === '晴' ? 5 : 30;
    const mid = D.rain ? 80 : D.sky === '阴' ? 60 : thunder ? 70 : 15, high = D.sky === '晴' ? 5 : 40;
    const sky = thunder ? '雷' : precip >= .1 ? '雨' : sea ? '晴' : D.sky;
    out.push({ h, night, temp, feels, gust, dir: 200 + r() * 60, precip, thunder, cape: capeLvl, sea, top: sea ? D.top + Math.round(r() * 100) : null,
      fz: Math.round((D.fz + (12 - Math.abs(h - 14)) * 15 + r() * 100) / 50) * 50, low: Math.round(low), mid: Math.round(mid), high: Math.round(high), sky });
  }
  return out;
}
const tLow = () => document.getElementById('tLow').checked;
const beaufort = ms => [0.3,1.6,3.4,5.5,8,10.8,13.9,17.2,20.8,24.5,28.5,32.7].filter(t => ms >= t).length;
const icon = (x) => ({ '雷':'⛈', '雨':'🌧', '雪':'🌨', '阴':'☁️', '晴': x.night ? '🌙' : '☀️', '多云': x.night ? '☁️' : '⛅' })[x.sky];
const fmt = n => Math.round(n) + '°';

let state = { variant: new URLSearchParams(location.search).get('variant') || 'A', day: 0, bTab: '基础', sheet: null };

function cycle(d) { const ks = Object.keys(VARIANTS); state.variant = ks[(ks.indexOf(state.variant) + d + ks.length) % ks.length];
  history.replaceState(null, '', '?variant=' + state.variant); closeSheet(); render(); }
addEventListener('keydown', e => { if (e.target.matches('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });

// ---------- shared pieces (= what the page already has) ----------
function header() {
  const now = hoursOf(0)[0];
  const alertFail = document.getElementById('tAlertFail').checked;
  return `<div class="top">←<b>天气 · 我的位置</b></div>
  <div class="now"><span style="font-size:52px">${icon(now)}</span><span class="big">${fmt(now.temp)}</span>
    <div><div>${now.sky === '晴' ? '晴夜' : now.sky}</div><div class="sub">体感 ${fmt(now.feels)} · 西南风 ${beaufort(now.gust)} 级</div>
    <div class="sub">海拔 ${PLACE_ELE} m（GPS）</div></div></div>
  ${alertFail ? `<div class="muted-box">⚠ 预警获取失败，不代表没有预警 · <u>重试</u></div>`
    : `<div class="alert"><b>⚠ 大风黄色预警</b><br>预计 9 日白天山区阵风 8–9 级……
       <small>萍乡市气象台 · 10月6日 07:30 发布</small></div>`}`;
}
function confOf(i) { return document.getElementById('tConfNA').checked && i === state.day ? null : DAYS[i].conf; }
function confText(i) { const c = confOf(i); if (!c) return '可信度暂缺';
  return '可信度' + c[0] + (c[1].length ? '：' + c[1].join('、') : ''); }
function dayStrip(markStyle) {
  return `<div class="days">${DAYS.map((D, i) => { const hs = hoursOf(i), c = confOf(i);
    const hi = Math.max(...hs.map(x => x.temp)), lo = Math.min(...hs.map(x => x.temp)), p = hs.reduce((a, x) => a + x.precip, 0);
    const stormy = hs.some(x => x.thunder || x.precip >= 8 || x.gust >= 17.2);
    const mark = c && c[0] !== '高' ? (markStyle === 'bar' ? `<div class="confbar" style="background:${c[0] === '低' ? 'var(--err)' : 'var(--mid)'}"></div>`
      : `<span class="conf ${c[0] === '低' ? 'low' : 'mid'}">${markStyle === 'q' ? '?' : '信' + c[0]}</span>`) : (markStyle === 'bar' ? '<div class="confbar"></div>' : '<span class="conf">&nbsp;</span>');
    return `<div class="day ${i === state.day ? 'sel' : ''}" onclick="state.day=${i};render()">
      <div class="n">${NAMES[i]}</div><div class="d">10月${6 + i}日</div>
      <div style="font-size:24px;margin:4px 0">${icon({ sky: D.thunder ? '雷' : D.rain >= 1 ? '雨' : D.sky })}</div>
      <div>${fmt(hi)}</div><div class="sub">${fmt(lo)}</div><div class="p">${p >= .1 ? p.toFixed(1) : ''}</div>${mark}
      ${stormy ? '<span class="dot"></span>' : ''}</div>`; }).join('')}</div>`;
}
function dayHead() { return `<div class="dayhead"><span class="t">10月${6 + state.day}日 ${NAMES[state.day] === '今天' ? '周二' : NAMES[state.day]}</span><span class="sub">🌅 06:12 – 17:58</span></div>`; }
function confLine() { const c = confOf(state.day);
  return `<div class="line ${c && c[0] === '低' ? 'warn' : ''}">${confText(state.day)}</div>`; }
function attribution() { return `<div class="attr">预报数据：<a href="#">Open-Meteo.com</a>（CC BY 4.0），按地点海拔 ${PLACE_ELE} m 修正；预警：中国气象局（经和风天气）</div>`; }

// Base meteogram rows; extra rows = [{head, unit, height, cell(x) -> html}]
function meteogram(hs, extra = [], opts = {}) {
  const W = 52, base = [
    { head: '', h: 24, cell: x => `<span class="${x.h === NOW_HOUR && state.day === 0 ? '' : 'sub'}" style="${x.h === NOW_HOUR && state.day === 0 ? 'color:var(--pri)' : ''}">${x.h === NOW_HOUR && state.day === 0 ? '现在' : x.h + '时'}</span>` },
    { head: '', h: 36, cell: x => `<span style="font-size:22px">${icon(x)}</span>` },
    { head: '🌡', h: 88, curve: true },
    { head: '🧍', h: 28, cell: x => `<span class="${x.feels <= 0 ? 'red' : 'sub'}">${fmt(x.feels)}</span>` },
    { head: '💧<br>mm', h: 44, cell: x => x.precip >= .1 ? `<span style="color:var(--rain);font-size:11px">${x.precip.toFixed(1)}</span><div style="width:22px;height:${Math.sqrt(Math.min(x.precip, 10) / 10) * 28 + 2}px;background:${x.precip >= 8 ? 'var(--err)' : 'var(--rain)'};opacity:.75;border-radius:2px"></div>` : '' },
    { head: '💨<br>级', h: 44, cell: x => `<span class="${x.gust >= 17.2 ? 'red' : 'sub'}" style="transform:rotate(${x.dir + 180}deg);display:inline-block">➤</span><span class="${x.gust >= 17.2 ? 'red' : ''}">${beaufort(x.gust)}</span>` },
  ];
  const rows = opts.only ? extra : base.concat(extra);
  const t = hs.map(x => x.temp), lo = Math.min(...t), span = Math.max(4, Math.max(...t) - lo);
  const pts = t.map((v, i) => [W * (i + .5), 24 + (1 - (v - lo) / span) * 54]);
  const curve = `<svg width="${W * hs.length}" height="88">${'<polyline fill="none" stroke="#1a1c1e" stroke-width="2" points="' + pts.map(p => p.join(',')).join(' ') + '"/>'}
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#1a1c1e"/><text x="${p[0]}" y="${p[1] - 8}" font-size="13" text-anchor="middle">${fmt(t[i])}</text>`).join('')}</svg>`;
  const shade = hs.map((x, i) => x.night ? `<div style="position:absolute;top:0;bottom:0;left:${i * W}px;width:${W}px;background:var(--shade);z-index:-1"></div>` : '').join('');
  return `<div class="gram"><div class="heads">${rows.map(r => `<div style="height:${r.h}px">${r.head}</div>`).join('')}</div>
    <div class="scroll"><div class="cols" style="width:${W * hs.length}px;z-index:0">${shade}
    ${rows.map(r => r.curve ? curve : `<div class="row">${hs.map((x, i) => `<div class="cell" style="height:${r.h}px${opts.tap ? ';cursor:pointer' : ''}" ${opts.tap ? `onclick="openProfile(${i})"` : ''}>${r.cell(x)}</div>`).join('')}</div>`).join('')}
    </div></div></div>`;
}
// Cloud layers as three stacked grey bands per hour (高/中/低, top→bottom)
const cloudCell = x => `<div style="display:flex;flex-direction:column;gap:2px;width:44px">${[x.high, x.mid, x.low].map(v => `<div style="height:8px;border-radius:2px;background:rgba(110,120,135,${v / 100})"></div>`).join('')}</div>`;
const fzCell = x => `<span class="${x.fz < PLACE_ELE ? 'red' : 'sub'}" style="font-size:12px">${(x.fz / 1000).toFixed(1)}k</span>`;
const seaCell = x => x.sea ? `<span class="tag ${x.sea}">${x.sea}</span>` : '';
const thunderCell = x => x.cape === '低' ? '<span class="sub">·</span>' : `<span class="thunder ${x.cape}" style="font-size:12px">${x.cape}</span>`;

// Single-hour vertical profile (A and C): temperature vs height, RH ≥ 90 shaded as cloud, place / ground / 0°C / 云顶 marked.
function profileSvg(x) {
  const H = 300, Wd = 320, yOf = z => H - 20 - (z - 0) / 5600 * (H - 30), tOf = T => 30 + (T + 30) / 50 * (Wd - 50);
  const lv = LEVELS.filter(l => l[1] > GROUND - 300).map(([p, z]) => {
    const T = x.temp + (PLACE_ELE - z) * 0.0065 + (x.top && z < x.top ? -3 : 0);
    const rh = x.top && z < x.top && z > GROUND - 200 ? 96 : z > 3000 && x.mid > 50 ? 92 : z < 1500 && x.low > 60 ? 93 : 50;
    return { p, z, T, rh };
  });
  const clouds = lv.filter(l => l.rh >= 90).map(l => `<rect x="30" y="${yOf(l.z + 250)}" width="${Wd - 50}" height="${yOf(l.z - 250) - yOf(l.z + 250)}" fill="#c8ced8" opacity=".6"/>`).join('');
  const line = (z, color, label, dash, left) => `<line x1="30" x2="${Wd - 20}" y1="${yOf(z)}" y2="${yOf(z)}" stroke="${color}" stroke-width="1.5" ${dash ? 'stroke-dasharray="4 3"' : ''}/><text x="${left ? 34 : Wd - 22}" y="${yOf(z) + (left ? 12 : -3)}" font-size="11" fill="${color}" text-anchor="${left ? 'start' : 'end'}">${label}</text>`;
  return `<svg width="${Wd}" height="${H}" style="display:block;margin:auto">${clouds}
    <rect x="30" y="${yOf(GROUND)}" width="${Wd - 50}" height="${H - 20 - yOf(GROUND)}" fill="#e3d6c3"/>
    ${line(GROUND, '#8d6e63', '格点地面 ' + GROUND + ' m')}
    ${line(PLACE_ELE, 'var(--pri)', '📍 你在 ' + PLACE_ELE + ' m', true, true)}
    ${line(x.fz, '#0277bd', '0°C 层 ' + x.fz + ' m', true)}
    ${x.top ? line(x.top, '#666', '云顶约 ' + x.top + ' m') : ''}
    <polyline fill="none" stroke="var(--err)" stroke-width="2" points="${lv.map(l => tOf(l.T) + ',' + yOf(l.z)).join(' ')}"/>
    ${[0, 2000, 4000].map(z => `<text x="2" y="${yOf(z) + 4}" font-size="10" fill="#5d6066">${z / 1000}k</text>`).join('')}
    ${[-20, 0, 20].map(T => `<text x="${tOf(T)}" y="${H - 4}" font-size="10" fill="#5d6066" text-anchor="middle">${T}°</text>`).join('')}
  </svg><div class="sub" style="text-align:center">红线：气温；灰：云（相对湿度 ≥ 90%）</div>`;
}
function openProfile(i) { state.sheet = i; render(); }
function closeSheet() { state.sheet = null; renderSheet(); }
function renderSheet() {
  const sh = document.getElementById('sheet'), bg = document.getElementById('bg');
  const on = state.sheet !== null && state.variant !== 'B';
  sh.classList.toggle('on', on); bg.classList.toggle('on', on);
  if (!on) return;
  const x = hoursOf(state.day)[state.sheet];
  sh.innerHTML = `<div class="grab"></div><div style="display:flex;justify-content:space-between"><b>${NAMES[state.day]} ${x.h}时 · 垂直剖面</b><span onclick="closeSheet()" style="cursor:pointer">✕</span></div>
    <div class="sub" style="margin:4px 0 8px">${x.sea ? `云海可能性 <span class="tag ${x.sea}">${x.sea}</span> · 云顶约 ${x.top} m，比你低 ${PLACE_ELE - x.top} m` : tLow() ? '比周围不够高，不判云海' : '无云海'}
     · 雷暴潜势 ${x.cape} · 云量 低${x.low}% 中${x.mid}% 高${x.high}%</div>${profileSvg(x)}`;
}

// ---------- A: one long meteogram; new rows under the old; tap any hour → 垂直剖面 sheet ----------
function VariantA(hs) {
  const extra = [
    { head: '☁️<br><span style="font-size:9px">高中低</span>', h: 40, cell: cloudCell },
    ...(tLow() ? [] : [{ head: '🌄<br><span style="font-size:9px">云海</span>', h: 30, cell: seaCell }]),
    { head: '⛈<br><span style="font-size:9px">雷暴</span>', h: 28, cell: thunderCell },
    { head: '❄<br><span style="font-size:9px">0°C</span>', h: 30, cell: fzCell },
  ];
  return header() + dayStrip('tag') + dayHead() + confLine() + meteogram(hs, extra, { tap: true })
    + `<div class="hint">点任一小时看垂直剖面</div>` + attribution();
}

// ---------- B: meteogram keeps today's rows; a switch flips the lower half to 云 / 山地; a time–height 剖面 instead of sheets ----------
function crossSection(hs) {
  const W = 52, H = 220, yOf = z => H - 16 - (z - 600) / 4400 * (H - 26);
  let svg = '';
  hs.forEach((x, i) => {
    // cloud blocks by layer: 低 below 2000 (or up to 云顶), 中 2000–6000 clipped, 高 is not drawn (above chart)
    const lowTop = x.top || 2000;
    svg += `<rect x="${i * W}" y="${yOf(lowTop)}" width="${W}" height="${yOf(600) - yOf(lowTop)}" fill="rgba(110,120,135,${x.low / 130})"/>`;
    svg += `<rect x="${i * W}" y="${yOf(5000)}" width="${W}" height="${yOf(3000) - yOf(5000)}" fill="rgba(110,120,135,${x.mid / 160})"/>`;
    if (x.night) svg = `<rect x="${i * W}" y="0" width="${W}" height="${H}" fill="var(--shade)"/>` + svg;
    if (x.cape !== '低') svg += `<text x="${i * W + W / 2}" y="14" font-size="14" text-anchor="middle">${x.cape === '高' ? '⛈' : '⚡'}</text>`;
  });
  const fz = hs.map((x, i) => `${i * W + W / 2},${yOf(Math.min(x.fz, 5000))}`).join(' ');
  const tops = hs.map((x, i) => x.top ? `<line x1="${i * W + 6}" x2="${i * W + W - 6}" y1="${yOf(x.top)}" y2="${yOf(x.top)}" stroke="#555" stroke-width="2"/>` : '').join('');
  const ground = `<rect x="0" y="${yOf(GROUND)}" width="${W * hs.length}" height="${H}" fill="#e3d6c3"/>`;
  return `<div class="gram"><div class="heads">${[5000, 4000, 3000, 2000, 1000].map(z => `<div style="height:${(yOf(z - 1000) - yOf(z))}px;justify-content:flex-start">${z / 1000}k</div>`).join('')}</div>
    <div class="scroll"><svg width="${W * hs.length}" height="${H}">${svg}${ground}${tops}
      <polyline fill="none" stroke="#0277bd" stroke-width="2" stroke-dasharray="5 3" points="${fz}"/>
      <line x1="0" x2="${W * hs.length}" y1="${yOf(PLACE_ELE)}" y2="${yOf(PLACE_ELE)}" stroke="var(--pri)" stroke-width="1.5"/>
      <text x="4" y="${yOf(PLACE_ELE) - 4}" font-size="11" fill="var(--pri)">📍 ${PLACE_ELE} m</text>
      ${hs.map((x, i) => `<text x="${i * W + W / 2}" y="${H - 2}" font-size="11" fill="#5d6066" text-anchor="middle">${x.h}时</text>`).join('')}
    </svg></div></div>
    <div class="hint">灰块：云（下：低云，到估算云顶；上：中云）· 蓝虚线：0°C 层 · 黑短线：云顶 · ⚡⛈：雷暴潜势中 / 高</div>`;
}
function VariantB(hs) {
  const tabs = ['基础', '云与云海', '剖面'];
  let body;
  if (state.bTab === '基础') body = meteogram(hs);
  else if (state.bTab === '云与云海') body = meteogram(hs, [
    { head: '', h: 24, cell: x => `<span class="sub">${x.h}时</span>` },
    { head: '☁️<br><span style="font-size:9px">高中低</span>', h: 40, cell: cloudCell },
    ...(tLow() ? [] : [{ head: '🌄', h: 30, cell: seaCell }, { head: '<span style="font-size:9px">云顶</span>', h: 28, cell: x => x.top ? `<span class="sub" style="font-size:12px">${x.top}</span>` : '' }]),
    { head: '⛈', h: 28, cell: thunderCell },
  ], { only: true });
  else body = crossSection(hs);
  return header() + dayStrip('bar') + dayHead() + confLine()
    + `<div class="seg">${tabs.map(t => `<button class="${t === state.bTab ? 'on' : ''}" onclick="state.bTab='${t}';render()">${t}</button>`).join('')}</div>`
    + body + attribution();
}

// ---------- C: 当天要点 cards between date strip and meteogram; meteogram gets only 云海; everything else via cards / sheet ----------
function VariantC(hs) {
  const seaHrs = hs.filter(x => x.sea && x.sea !== '低'), cape = hs.filter(x => x.cape !== '低'), fzMin = Math.min(...hs.map(x => x.fz)), fzMax = Math.max(...hs.map(x => x.fz));
  const c = confOf(state.day);
  const best = hs.indexOf(seaHrs[0] || cape[0] || hs[0]);
  const cards = [
    !tLow() && { k: '云海', v: seaHrs.length ? `${seaHrs[0].h}–${seaHrs.at(-1).h + 1}时 ${seaHrs[0].sea}` : '不太可能', s: seaHrs.length ? `云顶约 ${seaHrs[0].top} m，你在 ${PLACE_ELE} m` : '', i: best },
    { k: '雷暴潜势', v: cape.length ? `${cape[0].h}–${cape.at(-1).h + 1}时 ${cape.some(x => x.cape === '高') ? '高' : '中'}` : '低', s: '', warn: cape.some(x => x.cape === '高'), i: cape.length ? hs.indexOf(cape[0]) : 0 },
    { k: '0°C 层', v: `${fzMin}–${fzMax} m`, s: fzMin < PLACE_ELE ? '低于你所在的海拔' : `高于你 ${fzMin - PLACE_ELE} m 以上`, warn: fzMin < PLACE_ELE, i: hs.findIndex(x => x.fz === fzMin) },
    { k: '云量', v: `低 ${Math.round(hs.reduce((a, x) => a + x.low, 0) / hs.length)}%`, s: `中 ${Math.round(hs.reduce((a, x) => a + x.mid, 0) / hs.length)}% · 高 ${Math.round(hs.reduce((a, x) => a + x.high, 0) / hs.length)}%`, i: 0 },
    { k: '可信度', v: c ? c[0] : '暂缺', s: c && c[1].length ? '拖低的：' + c[1].join('、') : '', warn: c && c[0] === '低', i: null },
  ].filter(Boolean);
  return header() + dayStrip('q') + dayHead()
    + `<div class="cards">${cards.map(x => `<div class="chip ${x.warn ? 'warn' : ''}" ${x.i !== null ? `onclick="openProfile(${x.i})"` : ''}><h4>${x.k}</h4><p>${x.v}</p><small>${x.s}</small></div>`).join('')}</div>`
    + meteogram(hs, tLow() ? [] : [{ head: '🌄', h: 30, cell: seaCell }], { tap: true })
    + `<div class="hint">点卡片或任一小时看那一刻的垂直剖面</div>` + attribution();
}

function render() {
  const hs = hoursOf(state.day);
  document.getElementById('app').innerHTML = ({ A: VariantA, B: VariantB, C: VariantC })[state.variant](hs);
  document.getElementById('vlabel').textContent = `${state.variant}（${VARIANTS[state.variant]}）`;
  document.getElementById('state').textContent = JSON.stringify({ variant: state.variant, day: NAMES[state.day], conf: confOf(state.day), bTab: state.bTab, sheetHour: state.sheet,
    alertFail: document.getElementById('tAlertFail').checked, notHighEnough: tLow() }, null, 1);
  renderSheet();
}
render();
</script>
</body>
</html>
