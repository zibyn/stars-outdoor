name: server
on:
  push:
    branches: [main]
    paths: [server/**, .github/workflows/server.yml]
  # Every PR: it's a required check (main's ruleset), and a path-filtered one would leave docs-only PRs pending forever.
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go generate ./... && git diff --exit-code # api/ must match openapi.yaml (ADR 0004)
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
