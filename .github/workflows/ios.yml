name: ios
# :shared's iOS targets: Linux compiles them but can't run their tests.
on:
  push:
    branches: [main]
    paths: &paths [shared/**, server/openapi.yaml, gradle/**, '*.gradle.kts', gradle.properties, .github/workflows/ios.yml]
  pull_request:
    paths: *paths
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test
