name: style-lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  style-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/style-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/style-lint/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
